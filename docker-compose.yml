# Production-style stack: FastAPI + PostgreSQL.
# Local dev does NOT need this — the app runs on SQLite out of the box
# (uvicorn app.main:app). Use compose when you want the full Postgres setup.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: neander
      POSTGRES_PASSWORD: neander
      POSTGRES_DB: neanderprompt
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U neander"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://neander:neander@db:5432/neanderprompt
    ports:
      - "8000:8000"

volumes:
  pgdata:
